  <style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #edf1ea;
  --shell: #fbfcf9;
  --surface: #ffffff;
  --surface-soft: #f4f7f2;
  --surface-strong: #e8eee5;
  --text: #18221b;
  --muted: #667168;
  --line: #dde5dc;
  --accent: #28553f;
  --accent-strong: #173728;
  --accent-soft: #d7e8dc;
  --accent-mint: #8bc59c;
  --shadow: 0 18px 42px rgba(24, 34, 27, 0.08);
  --shadow-soft: 0 10px 24px rgba(24, 34, 27, 0.06);
  --radius: 8px;
}

html {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  width: 100%;
  max-width: 100%;
  background: linear-gradient(180deg, #eef2ec 0%, #f8faf7 48%, #edf1ea 100%);
  color: var(--text);
  font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

.shell {
  width: min(1400px, calc(100% - 32px));
  min-height: calc(100vh - 32px);
  margin: 16px auto;
  display: grid;
  grid-template-columns: 1fr;
  background: var(--shell);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.shell,
.main,
.content-grid,
.panel,
.panel-head,
.panel-head > div,
.panel-copy,
form,
.field,
.time-grid,
.hours-row,
.records-list,
.rec,
.rec-body,
.indicator-grid {
  min-width: 0;
}

.sidebar {
  padding: 24px 18px;
  background: #fcfdfb;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  background: radial-gradient(circle at 30% 30%, #93cf9f 0%, #6fb785 32%, #28553f 100%);
  position: relative;
  flex-shrink: 0;
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: 10px;
  border: 2px solid rgba(255, 255, 255, 0.8);
  border-radius: 999px;
}

.brand-name {
  font-size: 18px;
  font-weight: 800;
}

.brand-sub {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.nav {
  display: grid;
  gap: 8px;
}

.nav-item {

  <script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjEjM2_m9j0aK9HHcJiOzin4NuAyPqzSh02RcIE2wBg2cNO6abpA8aKaqihStUacXk/exec";
const HOURLY_RATE = 10320;
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let selectedEndTime = "";
let allRecords = [];

document.addEventListener("DOMContentLoaded", () => {
  setTodayDate();
  setupPickerFields();
  setupTimeButtons();
  setupForm();
  setupMonthNavigation();
  refreshDashboard();
});

function refreshDashboard() {
  loadRecords();
  loadStats();
}

function setTodayDate() {
  document.getElementById("date").value = todayIso();
}

function setupPickerFields() {
  const dateInput = document.getElementById("date");
  const startTimeInput = document.getElementById("startTime");
  const dateDisplay = document.getElementById("dateDisplay");
  const startTimeDisplay = document.getElementById("startTimeDisplay");

  const syncDisplays = () => {
    dateDisplay.textContent = formatPickerDate(dateInput.value);
    startTimeDisplay.textContent = formatPickerTime(startTimeInput.value);
  };

  dateInput.addEventListener("input", syncDisplays);
  dateInput.addEventListener("change", syncDisplays);
  startTimeInput.addEventListener("input", () => {
    syncDisplays();
    calcWorkHours();
  });
  startTimeInput.addEventListener("change", () => {
    syncDisplays();
    calcWorkHours();
  });

  syncDisplays();
}

function setupTimeButtons() {
  document.querySelectorAll(".time-btn").forEach((button) => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".time-btn").forEach((candidate) => {
        candidate.classList.remove("selected");
      });
      button.classList.add("selected");
      selectedEndTime = button.dataset.time || "";
      calcWorkHours();
    });
  });
}

function setupForm() {
  document.getElementById("workForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const workHours = document.getElementById("calculatedHours").textContent;
    if (workHours === "--:--" || !selectedEndTime) {
      showToast("퇴근 시간을 먼저 선택해주세요.", "err");
      return;
    }

    const button = document.getElementById("submitBtn");
    button.disabled = true;
    button.textContent = "저장 중...";

    try {
      const response = await gsCall({
        action: "add",
        date: document.getElementById("date").value,
        startTime: document.getElementById("startTime").value,
        endTime: selectedEndTime,
        breakMinutes: "0",
        workHours,
        note: ""
      });

      if (!response.success) {
        showToast(response.message || "저장 중 문제가 생겼습니다.", "err");
        return;
      }

      showToast(response.message || "근무 기록이 저장되었습니다.", "ok");
      resetTimeSelection();
      refreshDashboard();
    } catch (error) {
      showToast("연결 오류가 발생했습니다.", "err");
    } finally {
      button.textContent = "기록 저장";
      updateSubmitState();
    }
  });
}

function setupMonthNavigation() {
  updateMonthLabel();

  document.getElementById("prevMonth").addEventListener("click", () => {
    currentMonth -= 1;
    if (currentMonth < 1) {
      currentMonth = 12;
      currentYear -= 1;
    }
    updateMonthLabel();
    refreshDashboard();
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    currentMonth += 1;
    if (currentMonth > 12) {
      currentMonth = 1;
      currentYear += 1;
    }
    updateMonthLabel();
    refreshDashboard();
  });
}

function updateMonthLabel() {
  const label = `${currentYear}.${pad(currentMonth)}`;
  document.getElementById("monthLabel").textContent = label;
  const sidebarMonthLabel = document.getElementById("sidebarMonthLabel");
  if (sidebarMonthLabel) {
    sidebarMonthLabel.textContent = label;
  }
}

function calcWorkHours() {
  const startTime = document.getElementById("startTime").value;
  const display = document.getElementById("calculatedHours");

  if (!startTime || !selectedEndTime) {
    display.textContent = "--:--";
    updateSubmitState();
    return;
  }

  const totalMinutes = diffMinutes(startTime, selectedEndTime);
  if (totalMinutes <= 0) {
    display.textContent = "--:--";
    updateSubmitState();
    return;
  }

  display.textContent = formatClock(totalMinutes);
  updateSubmitState();
}

function updateSubmitState() {
  const startTime = document.getElementById("startTime").value;
  const isValid = Boolean(startTime && selectedEndTime && diffMinutes(startTime, selectedEndTime) > 0);
  document.getElementById("submitBtn").disabled = !isValid;
}

function resetTimeSelection() {
  selectedEndTime = "";
  document.querySelectorAll(".time-btn").forEach((button) => {
    button.classList.remove("selected");
  });
  document.getElementById("calculatedHours").textContent = "--:--";
}

function gsCall(params) {
  return new Promise((resolve, reject) => {
    const callbackName = `_gs_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
    const url = new URL(SCRIPT_URL);
    const script = document.createElement("script");

    Object.entries({ ...params, callback: callbackName }).forEach(([key, value]) => {
      url.searchParams.set(key, value);
    });

    window[callbackName] = (payload) => {
      cleanup();
      resolve(payload);
    };

    script.src = url.toString();
    script.async = true;
    script.onerror = () => {
      cleanup();
      reject(new Error("request_failed"));
    };

    function cleanup() {
      delete window[callbackName];
      script.remove();
    }

    document.head.appendChild(script);
  });
}

async function loadRecords() {
  const list = document.getElementById("recordsList");
  list.innerHTML = '<div class="state-empty">불러오는 중...</div>';

  try {
    const response = await gsCall({ action: "records" });
    if (!response.success) {
      list.innerHTML = `<div class="state-empty">${escapeHtml(response.message || "기록을 불러오지 못했습니다.")}</div>`;
      allRecords = [];
      return;
    }

    allRecords = (response.records || [])
      .map(normalizeRecord)
      .filter((record) => record.date)
      .sort((left, right) => right.date.localeCompare(left.date));

    const monthPrefix = `${currentYear}-${pad(currentMonth)}`;
    const recordsInMonth = allRecords.filter((record) => record.date.startsWith(monthPrefix));

    if (!recordsInMonth.length) {
      list.innerHTML = '<div class="state-empty">선택한 달에는 저장된 근무 기록이 없습니다.</div>';
      return;
    }

    list.innerHTML = recordsInMonth.map(renderRecord).join("");
  } catch (error) {
    list.innerHTML = '<div class="state-empty">기록을 불러오는 중 연결 오류가 발생했습니다.</div>';
    allRecords = [];
  }
}

function normalizeRecord(record) {
  return {
    id: record.id || "",
    date: normalizeDateValue(record.date),
    startTime: normalizeTimeValue(record.startTime),
    endTime: normalizeTimeValue(record.endTime),
    workHours: normalizeDurationValue(record.workHours),
    note: typeof record.note === "string" ? record.note.trim() : ""
  };
}

function normalizeDateValue(value) {
  if (!value) {
    return "";
  }

  if (value instanceof Date && !Number.isNaN(value.getTime())) {
    return `${value.getFullYear()}-${pad(value.getMonth() + 1)}-${pad(value.getDate())}`;
  }

  const text = String(value).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    return text;
  }

  const parsed = new Date(text);
  if (!Number.isNaN(parsed.getTime())) {
    return `${parsed.getFullYear()}-${pad(parsed.getMonth() + 1)}-${pad(parsed.getDate())}`;
  }

  return text;
}

function normalizeTimeValue(value) {
  if (!value) {
    return "--";
  }

  if (value instanceof Date && !Number.isNaN(value.getTime())) {
    return `${pad(value.getHours())}:${pad(value.getMinutes())}`;
  }

  const text = String(value).trim();
  const clockMatch = text.match(/^(\d{1,2}):(\d{2})/);
  if (clockMatch) {
    return `${clockMatch[1].padStart(2, "0")}:${clockMatch[2]}`;
  }

  const parsed = new Date(text);
  if (!Number.isNaN(parsed.getTime())) {
    return `${pad(parsed.getHours())}:${pad(parsed.getMinutes())}`;
  }

  return "--";
}

function normalizeDurationValue(value) {
  const normalized = normalizeTimeValue(value);
  return normalized === "--" ? "00:00" : normalized;
}

function renderRecord(record) {
  const date = new Date(`${record.date}T00:00:00`);
  const weekday = WEEKDAYS[date.getDay()];

  return `
    <article class="rec">
      <div class="rec-date">
        <span class="rec-day">${pad(date.getDate())}</span>
        <span class="rec-month">${date.getFullYear()}.${pad(date.getMonth() + 1)}</span>
        <span class="rec-weekday">${weekday}요일</span>
      </div>
      <div class="rec-body">
        <div class="rec-header">
          <h3 class="rec-title">${formatLongDate(record.date)}</h3>
        </div>
        <div class="indicator-grid">
          ${renderIndicator("시작", record.startTime)}
          ${renderIndicator("종료", record.endTime)}
          ${renderIndicator("근무시간", record.workHours)}
        </div>
      </div>
    </article>
  `;
}

function renderIndicator(label, value) {
  return `
    <div class="indicator">
      <span class="indicator-label">${escapeHtml(label)}</span>
      <strong class="indicator-value">${escapeHtml(value)}</strong>
    </div>
  `;
}

async function loadStats() {
  try {
    const response = await gsCall({
      action: "stats",
      year: currentYear,
      month: currentMonth
    });

    if (!response.success) {
      return;
    }

    const workDays = Number(response.workDays || 0);
    const totalMinutes = clockToMinutes(normalizeDurationValue(response.totalWorkHours));

    if (totalMinutes === 0) {
      document.getElementById("statHours").textContent = "0시간";
      document.getElementById("statHoursSub").textContent = "기록이 없습니다.";
      document.getElementById("statSalary").textContent = "-";
      return;
    }

    document.getElementById("statHours").textContent = formatMinutesLabel(totalMinutes);
    document.getElementById("statHoursSub").textContent = `${workDays}일 근무`;

    const salary = Math.round((totalMinutes / 60) * HOURLY_RATE);
    document.getElementById("statSalary").textContent = `${salary.toLocaleString("ko-KR")}원`;
  } catch (error) {
    // 통계 로딩 실패 시 현재 화면을 유지합니다.
  }
}

function diffMinutes(startTime, endTime) {
  const [startHours, startMinutes] = startTime.split(":").map(Number);
  const [endHours, endMinutes] = endTime.split(":").map(Number);
  return endHours * 60 + endMinutes - (startHours * 60 + startMinutes);
}

function clockToMinutes(clock) {
  const [hours, minutes] = String(clock || "00:00").split(":").map(Number);
  return (hours || 0) * 60 + (minutes || 0);
}

function formatClock(totalMinutes) {
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return `${pad(hours)}:${pad(minutes)}`;
}

function formatMinutesLabel(totalMinutes) {
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (minutes === 0) {
    return `${hours}시간`;
  }
  return `${hours}시간 ${minutes}분`;
}

function formatLongDate(dateText) {
  const date = new Date(`${dateText}T00:00:00`);
  return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
}

function formatPickerDate(dateText) {
  if (!dateText) {
    return "날짜 선택";
  }
  const [year, month, day] = dateText.split("-").map(Number);
  if (!year || !month || !day) {
    return dateText;
  }
  return `${year}. ${month}. ${day}.`;
}

function formatPickerTime(timeText) {
  if (!timeText) {
    return "출근 시간 선택";
  }
  const [rawHours, rawMinutes] = timeText.split(":").map(Number);
  if (Number.isNaN(rawHours) || Number.isNaN(rawMinutes)) {
    return timeText;
  }
  const meridiem = rawHours < 12 ? "오전" : "오후";
  const hour = rawHours % 12 || 12;
  return `${meridiem} ${hour}:${pad(rawMinutes)}`;
}

function formatMonthDay(dateText) {
  const date = new Date(`${dateText}T00:00:00`);
  return `${date.getMonth() + 1}월 ${date.getDate()}일`;
}

function formatWeekday(dateText) {
  const date = new Date(`${dateText}T00:00:00`);
  return `${WEEKDAYS[date.getDay()]}요일`;
}

function pad(value) {
  return String(value).padStart(2, "0");
}

function todayIso() {
  const today = new Date();
  return `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

let toastTimer;
function showToast(message, type = "") {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.className = "toast";
  }, 2600);
}

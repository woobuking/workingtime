<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>근무 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">⏱</span>
      <span class="logo-text">WorkTime</span>
    </div>
    <nav class="nav">
      <div class="nav-item active">
        <span class="nav-icon">◫</span>
        <span>대시보드</span>
      </div>
    </nav>
  </aside>

  <!-- 메인 -->
  <main class="main">

    <!-- 상단 바 -->
    <div class="topbar">
      <div>
        <h1 class="page-title">대시보드</h1>
        <p class="page-sub">근무 시간을 기록하고 관리하세요</p>
      </div>
      <div class="month-nav">
        <button class="month-btn" id="prevMonth">‹</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="month-btn" id="nextMonth">›</button>
      </div>
    </div>

    <!-- 통계 카드 -->
    <div class="stats-grid">
      <div class="stat-card green">
        <div class="stat-top">
          <span class="stat-name">근무일</span>
          <span class="stat-arrow">↗</span>
        </div>
        <div class="stat-num" id="statDays">0</div>
        <div class="stat-desc">이번 달</div>
      </div>
      <div class="stat-card white">
        <div class="stat-top">
          <span class="stat-name">총 근무시간</span>
          <span class="stat-arrow">↗</span>
        </div>
        <div class="stat-num dark" id="statHours">00:00</div>
        <div class="stat-desc">이번 달</div>
      </div>
      <div class="stat-card white">
        <div class="stat-top">
          <span class="stat-name">평균 근무시간</span>
          <span class="stat-arrow">↗</span>
        </div>
        <div class="stat-num dark" id="statAvg">--:--</div>
        <div class="stat-desc">1일 평균</div>
      </div>
    </div>

    <div class="body-grid">

      <!-- 입력 카드 -->
      <div class="card input-card">
        <div class="card-header">
          <span class="card-title">기록 추가</span>
        </div>

        <form id="workForm">

          <!-- 날짜 -->
          <div class="field">
            <label>날짜</label>
            <input type="date" id="date" required />
          </div>

          <!-- 출근 시간 -->
          <div class="field">
            <label>출근 시간</label>
            <input type="time" id="startTime" value="10:30" required />
          </div>

          <!-- 퇴근 시간 버튼 -->
          <div class="field">
            <label>퇴근 시간</label>
            <div class="time-grid">
              <button type="button" class="time-btn" data-time="14:30">14:30</button>
              <button type="button" class="time-btn" data-time="15:00">15:00</button>
              <button type="button" class="time-btn" data-time="15:30">15:30</button>
              <button type="button" class="time-btn" data-time="16:00">16:00</button>
              <button type="button" class="time-btn" data-time="16:30">16:30</button>
              <button type="button" class="time-btn" data-time="17:00">17:00</button>
              <button type="button" class="time-btn" data-time="17:30">17:30</button>
            </div>
          </div>

          <!-- 근무시간 표시 -->
          <div class="hours-row" id="hoursRow">
            <span class="hours-label">실 근무시간</span>
            <span class="hours-val" id="calculatedHours">--:--</span>
          </div>

          <button type="submit" class="btn-save" id="submitBtn" disabled>저장하기</button>

        </form>
      </div>

      <!-- 기록 목록 -->
      <div class="card records-card">
        <div class="card-header">
          <span class="card-title">근무 기록</span>
        </div>
        <div id="recordsList">
          <div class="state-empty">불러오는 중…</div>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
